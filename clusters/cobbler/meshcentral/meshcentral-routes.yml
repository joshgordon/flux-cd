---
# Public: agents only. Anything else on remote.bluesmoke.network gets a 404
# from the gateway, so the login page and admin UI aren't reachable from the
# internet. Kyverno still adds the CrowdSec ExternalAuth filter to each rule.
#
# Agents are told to use these relative to the host they connected to, so
# they always come back through this hostname:
#   agent.ashx          control channel (WebSocket)
#   meshrelay.ashx      remote desktop / terminal / files tunnels
#   agenttransfer.ashx  agent-side file transfers
#   meshagents          agent self-updates (and installer downloads)
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: meshcentral
  namespace: meshcentral
spec:
  parentRefs:
    - name: external
      namespace: external-gateway
  hostnames:
    - remote.bluesmoke.network
  rules:
    - matches:
        - path: { type: PathPrefix, value: /agent.ashx }
        - path: { type: PathPrefix, value: /meshrelay.ashx }
        - path: { type: PathPrefix, value: /agenttransfer.ashx }
        - path: { type: PathPrefix, value: /meshagents }
      backendRefs:
        - name: meshcentral-http
          port: 80
    # Everything else (the UI, login, deep links) bounces to the internal
    # hostname, keeping the path. The longer agent prefixes above always win
    # over this catch-all. Only useful from the LAN/VPN; elsewhere the
    # internal name won't resolve.
    - matches:
        - path: { type: PathPrefix, value: / }
      filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            hostname: meshcentral.cobbler.gordns.net
            statusCode: 302
---
# Internal: the full UI, only on the internal gateway.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: meshcentral-admin
  namespace: meshcentral
spec:
  parentRefs:
    - name: internal
      namespace: internal-gateway
      sectionName: https
  hostnames:
    - meshcentral.cobbler.gordns.net
  rules:
    - backendRefs:
        - name: meshcentral-http
          port: 80
