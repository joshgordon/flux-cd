---
# Created by the Longhorn HelmRelease (install.createNamespace); declared here
# only so Flux can manage its labels. Never prune: deleting this manifest must
# not delete the namespace (and every Longhorn volume with it).
apiVersion: v1
kind: Namespace
metadata:
  name: longhorn-system
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
  labels:
    gateway.joshgordon.net/internal: "true"
