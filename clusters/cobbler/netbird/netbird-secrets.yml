---
# Server secrets, kept in OpenBao rather than letting the chart generate
# them, so they survive a namespace wipe / reinstall. Losing encryptionKey
# makes the encrypted columns in the SQLite store unreadable.
#
# Create before merging:
#   bao kv put secret/external-secrets/netbird/server \
#     authSecret="$(openssl rand -base64 32)" \
#     encryptionKey="$(openssl rand -base64 32)"
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: netbird-server
  namespace: netbird
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: netbird-server
  data:
    - secretKey: authSecret
      remoteRef:
        key: external-secrets/netbird/server
        property: authSecret
    - secretKey: encryptionKey
      remoteRef:
        key: external-secrets/netbird/server
        property: encryptionKey
