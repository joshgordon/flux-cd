---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: crowdsec
  namespace: flux-system
spec:
  interval: 10m
  releaseName: crowdsec
  targetNamespace: crowdsec
  chart:
    spec:
      chart: crowdsec
      # Latest release I could find on 2026-10-23 (bundles CrowdSec 1.8.1).
      # Check https://github.com/crowdsecurity/helm-charts/releases before merging.
      version: "0.24.3"
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        name: crowdsec
  values:
    # How container log lines are framed on disk. Set to "docker" if your
    # nodes don't run containerd.
    container_runtime: containerd

    config:
      # Mounted in the LAPI pod. Overriding this key replaces the chart's
      # default, so the auto_registration block must stay or agents can't register.
      config.yaml.local: |
        api:
          server:
            auto_registration:
              enabled: true
              token: "${REGISTRATION_TOKEN}" # handled by the chart, don't change
              allowed_ranges:
                - "10.0.0.0/8"
        db_config:
          flush:
            agents_autodelete:
              login_password: 60m
      # Mounted in the agent pods: on a clean shutdown, remove its own machine from LAPI.
      agent_config.yaml.local: |
        api:
          client:
            unregister_on_exit: true

      profiles.yaml: |
        name: default_ip_remediation
        filters:
          - Alert.Remediation == true && Alert.GetScope() == "Ip"
        decisions:
          - type: ban
            duration: 4h   # used only if duration_expr is removed
        # Repeat offenders get longer bans: 4h the first time, then 8h, 12h...
        duration_expr: Sprintf('%dh', (GetDecisionsCount(Alert.GetValue()) + 1) * 4)
        on_success: break
        ---
        name: default_range_remediation
        filters:
          - Alert.Remediation == true && Alert.GetScope() == "Range"
        decisions:
          - type: ban
            duration: 4h
        on_success: break

    agent:
      # Read Cilium's gateway access logs (the JSON format you set up in the
      # CiliumGatewayClassConfig). cilium-envoy also logs its own diagnostics;
      # those lines just show up as "unparsed" in cscli metrics.
      acquisition:
        - namespace: kube-system
          podName: cilium-envoy-*
          program: envoy
          poll_without_inotify: true
      env:
        - name: COLLECTIONS
          value: yanis-kouidri/envoy
      # cilium-envoy runs on every node, so the agent DaemonSet needs to as
      # well. Harmless if your control-plane nodes aren't tainted.
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule

    lapi:
      persistentVolume:
        data:
          enabled: true
          storageClassName: longhorn
          size: 1Gi
        config:
          enabled: true
          storageClassName: longhorn
          size: 100Mi
      env:
        # Pre-registers the bouncer with a fixed key from the secret, so the
        # bouncer and LAPI agree without a manual `cscli bouncers add`.
        - name: BOUNCER_KEY_envoy
          valueFrom:
            secretKeyRef:
              name: crowdsec-keys
              key: BOUNCER_KEY_envoy
        # Uncomment to enroll this instance in the CrowdSec console.
        # - name: ENROLL_KEY
        #   valueFrom:
        #     secretKeyRef:
        #       name: crowdsec-keys
        #       key: ENROLL_KEY
        # - name: ENROLL_INSTANCE_NAME
        #   value: cobbler

    appsec:
      enabled: true
      acquisitions:
        - source: appsec
          listen_addr: 0.0.0.0:7422
          path: /
          appsec_configs:
            - crowdsecurity/appsec-default
          labels:
            type: appsec
      env:
        - name: COLLECTIONS
          value: crowdsecurity/appsec-virtual-patching crowdsecurity/appsec-generic-rules
      # CrowdSec's docs note the default AppSec limit can OOM; this is their
      # suggested bump.
      resources:
        requests:
          cpu: 500m
          memory: 512Mi
        limits:
          cpu: 1000m
          memory: 1Gi
