---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: crowdsec-envoy-bouncer
  namespace: flux-system
spec:
  interval: 10m
  releaseName: crowdsec-envoy-bouncer
  targetNamespace: crowdsec
  dependsOn:
    - name: crowdsec
  chartRef:
    kind: OCIRepository
    name: envoy-proxy-bouncer
    namespace: flux-system
  values:
    # Gives a predictable Service name: crowdsec-envoy-bouncer.crowdsec.svc
    fullnameOverride: crowdsec-envoy-bouncer
    image:
      tag: v0.8.2
    config:
      server:
        grpcPort: 8080 # ext_authz, what the HTTPRoute filter points at
        httpPort: 8081 # only used for CAPTCHA pages
        logLevel: info # set to debug while verifying client-IP handling
      bouncer:
        enabled: true
        lapiURL: http://crowdsec-service.crowdsec.svc.cluster.local:8080
        apiKeySecretRef:
          name: crowdsec-keys
          key: BOUNCER_KEY_envoy
        metrics: true
      waf:
        enabled: true
        appSecURL: http://crowdsec-appsec-service.crowdsec.svc.cluster.local:7422
        apiKeySecretRef:
          name: crowdsec-keys
          key: BOUNCER_KEY_envoy
        # Only covers AppSec errors; IP bans from LAPI are still enforced.
        # Consider false once you trust the setup.
        failOpen: true
      # The bouncer reads the client IP from X-Forwarded-For. If testing
      # shows it picking a node/pod IP instead of the real client, list the
      # addresses it should skip over here (pod CIDR, node IPs, any CDN).
      trustedProxies:
        - 10.3.12.75
      # Addresses that bypass CrowdSec entirely (e.g. your LAN / VPN).
      exemptIPs:
        - 10.0.0.0/8
        - 192.168.0.0/16
        - 144.202.232.42
