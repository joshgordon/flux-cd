---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: crowdsec-envoy-bouncer
  namespace: flux-system
spec:
  interval: 10m
  releaseName: crowdsec-envoy-bouncer
  targetNamespace: crowdsec
  dependsOn:
    - name: crowdsec
  chartRef:
    kind: OCIRepository
    name: envoy-proxy-bouncer
    namespace: flux-system
  # The bouncer is in the request path of every external-gateway route
  # (ext_authz), so run two, on different nodes. The chart has no affinity
  # value; add it here. See also bouncer-pdb.yml.
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: crowdsec-envoy-bouncer
            patch: |
              - op: add
                path: /spec/template/spec/affinity
                value:
                  podAntiAffinity:
                    preferredDuringSchedulingIgnoredDuringExecution:
                      - weight: 100
                        podAffinityTerm:
                          topologyKey: kubernetes.io/hostname
                          labelSelector:
                            matchLabels:
                              app.kubernetes.io/name: envoy-proxy-bouncer
  values:
    replicaCount: 2
    # The chart's default is a 100m CPU limit. Envoy only waits 200ms for an
    # ext_authz answer (Cilium exposes no setting for it), and a page load
    # sends dozens of checks at once, so the bouncer was CPU-throttled in
    # ~45-50% of its active periods and checks timed out as empty 403s
    # (Immich JS chunks failing to load). No CPU limit: throttling is what
    # causes the stalls; the request and memory limit keep it in check.
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: null # removes the chart's 100m; omitting the key would keep it
        memory: 128Mi
    # Gives a predictable Service name: crowdsec-envoy-bouncer.crowdsec.svc
    fullnameOverride: crowdsec-envoy-bouncer
    image:
      tag: v0.8.2
    config:
      server:
        grpcPort: 8080 # ext_authz, what the HTTPRoute filter points at
        httpPort: 8081 # only used for CAPTCHA pages
        logLevel: info # set to debug while verifying client-IP handling
      bouncer:
        enabled: true
        lapiURL: http://crowdsec-service.crowdsec.svc.cluster.local:8080
        apiKeySecretRef:
          name: crowdsec-keys
          key: BOUNCER_KEY_envoy
        metrics: true
      waf:
        enabled: true
        appSecURL: http://crowdsec-appsec-service.crowdsec.svc.cluster.local:7422
        apiKeySecretRef:
          name: crowdsec-keys
          key: BOUNCER_KEY_envoy
        # Only covers AppSec errors; IP bans from LAPI are still enforced.
        # Consider false once you trust the setup.
        failOpen: true
        # Must stay well under Envoy's ext_authz timeout. Cilium sets no
        # timeout on the gRPC ext_authz filter (and Gateway API has no field
        # for one), so Envoy uses its 200ms default and, failing closed,
        # answers 403 when it runs out. With the chart default of 5s, a slow
        # AppSec made Envoy give up first, so failOpen above never got a
        # chance and a burst of Immich thumbnails came back as 403s, which
        # CrowdSec then banned as http-probing.
        httpTimeout: "150ms"
      # The bouncer reads the client IP from X-Forwarded-For. If testing
      # shows it picking a node/pod IP instead of the real client, list the
      # addresses it should skip over here (pod CIDR, node IPs, any CDN).
      trustedProxies:
        - 10.3.12.75
        - 10.3.14.0/26
      # Addresses that bypass CrowdSec entirely (e.g. your LAN / VPN).
      exemptIPs:
        - 144.202.232.42
