---
# HTTPRoutes in other namespaces need permission to reference the bouncer
# Service in the crowdsec namespace from their ExternalAuth filter.
# Add one `from` entry per namespace that has HTTPRoutes you want protected.
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: httproutes-to-crowdsec-bouncer
  namespace: crowdsec
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: miniflux
  to:
    - group: ""
      kind: Service
      name: crowdsec-envoy-bouncer
