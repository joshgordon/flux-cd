---
apiVersion: v1
kind: Service
metadata:
  name: plex
  namespace: legacy-nginx
spec:
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: plex-1
  namespace: legacy-nginx
  labels:
    kubernetes.io/service-name: plex
    endpointslice.kubernetes.io/managed-by: flux
addressType: IPv4
ports:
  - name: http
    port: 32400
    protocol: TCP
endpoints:
  - addresses:
      - 10.3.9.3
    conditions:
      ready: true
---
# One route for every hostname nginx still serves. Add/remove hostnames as
# you migrate things into the cluster.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: plex
  namespace: legacy-nginx
spec:
  parentRefs:
    - name: external
      namespace: external-gateway
  hostnames:
    - plex.joshgordon.app
  rules:
    - backendRefs:
        - name: plex
          port: 8080
