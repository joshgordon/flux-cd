---
# Lets the Cilium gateway route to the nginx host outside the cluster.
# A Service with no selector plus a hand-written EndpointSlice is the
# standard way to point a Service at a fixed external IP.
apiVersion: v1
kind: Namespace
metadata:
  name: legacy-nginx
---
apiVersion: v1
kind: Service
metadata:
  name: nginx
  namespace: legacy-nginx
spec:
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: nginx-1
  namespace: legacy-nginx
  labels:
    kubernetes.io/service-name: nginx # ties this slice to the Service
    endpointslice.kubernetes.io/managed-by: flux
addressType: IPv4
ports:
  - name: http
    port: 8080
    protocol: TCP
endpoints:
  - addresses:
      - 10.3.12.75
    conditions:
      ready: true
---
# One route for every hostname nginx still serves. Add/remove hostnames as
# you migrate things into the cluster.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: legacy-nginx
  namespace: legacy-nginx
spec:
  parentRefs:
    - name: external
      namespace: external-gateway
  hostnames:
    - "*.joshgordon.app"
    - joshgordon.app
    - "*.jmg.app"
    - jmg.app
    - "*.jmg.dev"
    - jmg.dev
    - "*.joshgordon.dev"
    - joshgordon.dev
    - "*.joshgordon.net"
    - joshgordon.net
    - "*.beef.cafe"
    - beef.cafe
  rules:
    - backendRefs:
        - name: nginx
          port: 8080
