---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: cnpg
  namespace: flux-system
spec:
  interval: 1h
  url: https://cloudnative-pg.github.io/charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cnpg
  namespace: flux-system
spec:
  storageNamespace: cnpg-system
  interval: 1h
  targetNamespace: cnpg-system
  install:
    createNamespace: true
  chart:
    spec:
      chart: cloudnative-pg
      version: "0.29.1" # <-- Renovate bumps this
      sourceRef:
        kind: HelmRepository
        name: cnpg
        namespace: flux-system
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cnpg-barman
  namespace: flux-system
spec:
  chart:
    spec:
      chart: plugin-barman-cloud
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        name: cnpg
  dependsOn:
    - name: cnpg
  interval: 1m0s
  releaseName: cnpg-barman
  storageNamespace: cnpg-system
  targetNamespace: cnpg-system
