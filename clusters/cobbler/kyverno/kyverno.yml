---
apiVersion: v1
kind: Namespace
metadata:
  name: kyverno
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: kyverno
  namespace: flux-system
spec:
  interval: 1h
  url: https://kyverno.github.io/kyverno/
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kyverno
  namespace: flux-system
spec:
  interval: 10m
  releaseName: kyverno
  targetNamespace: kyverno
  timeout: 10m
  chart:
    spec:
      chart: kyverno
      version: "3.9.2" # Kyverno v1.19.2, latest as of 2026-10-25
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        name: kyverno
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    # Single replicas are fine for a homelab. The admission controller only
    # gates *applying* matched resources (HTTPRoutes here), never live traffic,
    # so if it's down you just can't apply/modify HTTPRoutes until it's back.
    admissionController:
      replicas: 1
    backgroundController:
      replicas: 1
    cleanupController:
      replicas: 1
    reportsController:
      replicas: 1
