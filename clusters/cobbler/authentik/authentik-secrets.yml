---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-env
  namespace: authentik
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: authentik-env
    template:
      data:
        AUTHENTIK_SECRET_KEY: "{{ .secret_key }}"
        AUTHENTIK_POSTGRESQL__PASSWORD: "{{ .db_password }}"
  data:
    - secretKey: secret_key
      remoteRef:
        key: external-secrets/authentik/conf
        property: secret_key
    - secretKey: db_password
      remoteRef:
        key: external-secrets/authentik/db
        property: password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-db-role
  namespace: authentik
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: authentik-db-role
    template:
      type: kubernetes.io/basic-auth
      data:
        username: authentik
        password: "{{ .db_password }}"
  data:
    - secretKey: db_password
      remoteRef:
        key: external-secrets/authentik/db
        property: password
