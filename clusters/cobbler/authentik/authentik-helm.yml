---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: authentik
  namespace: flux-system
spec:
  interval: 1m0s
  url: https://charts.goauthentik.io
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: authentik-media
  namespace: authentik
spec:
  accessModes: [ReadWriteMany]
  storageClassName: longhorn
  resources:
    requests:
      storage: 1Gi
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: authentik
  namespace: flux-system
spec:
  targetNamespace: authentik
  chart:
    spec:
      chart: authentik
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        name: authentik
      version: 2026.8.3
  interval: 1m0s
  values:
    serviceAccount:
      fullnameOverride: authentik-server-sa
    global:
      envFrom:
        - secretRef:
            name: authentik-env

    authentik:
      postgresql:
        host: authentik-rw.authentik.svc.cluster.local
        name: authentik
        user: authentik
        port: 5432

    postgresql:
      enabled: false

    server:
      replicas: 1
      volumes:
        - name: media
          persistentVolumeClaim:
            claimName: authentik-media
      volumeMounts:
        - name: media
          mountPath: /data
      ingress:
        enabled: false
