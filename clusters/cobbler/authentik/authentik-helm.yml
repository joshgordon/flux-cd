---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: authentik
  namespace: flux-system
spec:
  interval: 1m0s
  url: https://charts.goauthentik.io
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: authentik-media
  namespace: authentik
spec:
  accessModes: [ReadWriteMany]
  storageClassName: longhorn
  resources:
    requests:
      storage: 1Gi
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: authentik
  namespace: flux-system
spec:
  targetNamespace: authentik
  chart:
    spec:
      chart: authentik
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        name: authentik
      version: 2026.8.5
  interval: 1m0s
  values:
    serviceAccount:
      fullnameOverride: authentik-server-sa

    authentik:
      postgresql:
        host: authentik-rw.authentik.svc.cluster.local
        name: authentik
        user: authentik
        port: 5432

    postgresql:
      enabled: false

    global:
      envFrom:
        - secretRef:
            name: authentik-env
      volumes:
        - name: media
          persistentVolumeClaim:
            claimName: authentik-media
        - name: ldap-joshgordon-net
          secret:
            secretName: ldap-tls-cert
            items:
              - key: tls.crt
                path: fullchain.pem
              - key: tls.key
                path: privkey.pem
      volumeMounts:
        - name: media
          mountPath: /data
        - name: ldap-joshgordon-net
          mountPath: /certs/ldap.joshgordon.net
          readOnly: true
