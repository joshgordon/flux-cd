apiVersion: v1
kind: Namespace
metadata:
  name: gatus
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: gatus
  name: gatus
  namespace: gatus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gatus
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: gatus
    spec:
      volumes:
        - name: config
          configMap:
            name: gatus-config
      containers:
        - image: ghcr.io/twin/gatus:v5.37.0
          name: gatus
          resources: {}
          envFrom:
            - secretRef:
                name: gatus-secret
            - secretRef:
                name: gatus-db
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: gatus
  name: gatus
  namespace: gatus
spec:
  ports:
    - port: 8080
      protocol: TCP
      targetPort: 8080
  selector:
    app: gatus
  type: ClusterIP
status:
  loadBalancer: {}
