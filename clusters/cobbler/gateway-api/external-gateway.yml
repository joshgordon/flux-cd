apiVersion: v1
kind: Namespace
metadata:
  name: external-gateway
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: external
  namespace: external-gateway
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-issuer
spec:
  gatewayClassName: cilium
  infrastructure:
    labels:
      expose: "true"
  listeners:
    - name: bluesmoke.network
      port: 443
      protocol: HTTPS
      hostname: "bluesmoke.network"
      allowedRoutes:
        namespaces:
          from: All
      tls:
        mode: Terminate
        certificateRefs:
          - name: bluesmoke-wildcard
    - name: star-bluesmoke.network
      port: 443
      protocol: HTTPS
      hostname: "*.bluesmoke.network"
      allowedRoutes:
        namespaces:
          from: All
      tls:
        mode: Terminate
        certificateRefs:
          - name: bluesmoke-wildcard
    - name: star-joshgordon-app
      port: 443
      protocol: HTTPS
      hostname: "*.joshgordon.app"
      allowedRoutes:
        namespaces:
          from: All
      tls:
        mode: Terminate
        certificateRefs:
          - name: joshgordon-wildcard
    - name: joshgordon-app
      port: 443
      protocol: HTTPS
      hostname: "joshgordon.app"
      allowedRoutes:
        namespaces:
          from: All
      tls:
        mode: Terminate
        certificateRefs:
          - name: joshgordon-wildcard
    - name: star-joshgordon-net
      port: 443
      protocol: HTTPS
      hostname: "*.joshgordon.net"
      allowedRoutes:
        namespaces:
          from: All
      tls:
        mode: Terminate
        certificateRefs:
          - name: joshgordon-net-wildcard
    - name: joshgordon-net
      port: 443
      protocol: HTTPS
      hostname: "joshgordon.net"
      allowedRoutes:
        namespaces:
          from: All
      tls:
        mode: Terminate
        certificateRefs:
          - name: joshgordon-net-wildcard
    - name: star-jmg-app
      port: 443
      protocol: HTTPS
      hostname: "*.jmg.app"
      allowedRoutes:
        namespaces:
          from: All
      tls:
        mode: Terminate
        certificateRefs:
          - name: jmgapp-wildcard
    - name: jmg-app
      port: 443
      protocol: HTTPS
      hostname: "jmg.app"
      allowedRoutes:
        namespaces:
          from: All
      tls:
        mode: Terminate
        certificateRefs:
          - name: jmgapp-wildcard
    - name: star-jmg-dev
      port: 443
      protocol: HTTPS
      hostname: "*.jmg.dev"
      allowedRoutes:
        namespaces:
          from: All
      tls:
        mode: Terminate
        certificateRefs:
          - name: jmgdev-wildcard
    - name: jmg-dev
      port: 443
      protocol: HTTPS
      hostname: "jmg.dev"
      allowedRoutes:
        namespaces:
          from: All
      tls:
        mode: Terminate
        certificateRefs:
          - name: jmgdev-wildcard
    - name: star-beef-cafe
      port: 443
      protocol: HTTPS
      hostname: "*.beef.cafe"
      allowedRoutes:
        namespaces:
          from: All
      tls:
        mode: Terminate
        certificateRefs:
          - name: beefcafe-wildcard
    - name: beef-cafe
      port: 443
      protocol: HTTPS
      hostname: "beef.cafe"
      allowedRoutes:
        namespaces:
          from: All
      tls:
        mode: Terminate
        certificateRefs:
          - name: beefcafe-wildcard
    - name: face-feed-beef-cafe
      port: 443
      protocol: HTTPS
      hostname: "face.feed.beef.cafe"
      allowedRoutes:
        namespaces:
          from: All
      tls:
        mode: Terminate
        certificateRefs:
          - name: beefcafe-wildcard
    - name: http
      port: 80
      protocol:
        HTTP
        # hostname: "*.joshgordon.app"
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: redirect-to-https
  namespace: external-gateway
spec:
  parentRefs:
    - name: external
      namespace: external-gateway
      sectionName: http
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 302
