apiVersion: v1
kind: Namespace
metadata:
  name: external-gateway
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: star.joshgordon.app
  namespace: external-gateway
spec:
  # Secret names are always required.
  secretName: joshgordon-wildcard
  commonName: "*.joshgordon.app"

  # At least one of commonName (possibly through literalSubject), dnsNames, uris, emailAddresses, ipAddresses or otherNames is required.
  dnsNames:
    - "*.joshgordon.app"

  # Issuer references are always required.
  issuerRef:
    name: letsencrypt-issuer
    kind: ClusterIssuer
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: external
  namespace: external-gateway
spec:
  gatewayClassName: cilium
  infrastructure:
    labels:
      expose: "true"
  listeners:
    - name: https
      port: 443
      protocol: HTTPS
      hostname: "*.joshgordon.app"
      allowedRoutes:
        namespaces:
          from: All
      tls:
        mode: Terminate
        certificateRefs:
          - name: joshgordon-wildcard
    - name: http
      port: 80
      protocol: HTTP
      hostname: "*.joshgordon.app"
#    allowedRoutes:
#      namespaces:
#        from: All
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: redirect-to-https
  namespace: external-gateway
spec:
  parentRefs:
    - name: external
      namespace: external-gateway
      sectionName: http
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 302
